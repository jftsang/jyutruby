[project]
name = "jyutruby"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.1",
    "bcrypt>=4.0",
    "fastapi>=0.141.1",
    "itsdangerous>=2.2.0",
    "python-dotenv>=1.2.3",
    "jinja2>=3.1.6",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.31.0",
    "webauthn>=3.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=8.0",
    "ruff>=0.16.5",
    "ty>=0.0.77",
]
